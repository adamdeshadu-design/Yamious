name: System net

on:
  workflow_dispatch:

jobs:
  maintain:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Initialize Environment
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Configure Access
        run: Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString "WindowsRDP#2025" -AsPlainText -Force)

      - name: Network Optimization
        run: |
          Write-Host "Optimizing network settings..."
          
          # TCP optimizations
          netsh int tcp set global autotuninglevel=normal
          netsh int tcp set global chimney=enabled
          netsh int tcp set global rss=enabled
          netsh int tcp set global netdma=enabled
          netsh int tcp set global dca=enabled
          netsh int tcp set global timestamps=disabled
          netsh int tcp set global initialRto=2000
          
          # Remove bandwidth limits
          netsh int tcp set global autotuninglevel=experimental
          
          # Disable Nagle's Algorithm (reduces latency)
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces" /v TCPNoDelay /t REG_DWORD /d 1 /f
          
          # Increase TCP buffer sizes
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters" /v TcpWindowSize /t REG_DWORD /d 65535 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters" /v GlobalMaxTcpWindowSize /t REG_DWORD /d 65535 /f
          
          # Disable Windows Defender network inspection (frees bandwidth)
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\NIS" /v DisableLocalNIS /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection" /v DisableRealtimeMonitoring /t REG_DWORD /d 1 /f
          
          # Optimize network throttling
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" /v NetworkThrottlingIndex /t REG_DWORD /d 4294967295 /f
          
          # Disable QoS (frees bandwidth)
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\QoS" /v DisableQoS /t REG_DWORD /d 1 /f
          
          Write-Host "Network optimization complete"

      - name: Install Components
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "$env:TEMP\svc.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\svc.msi`" /quiet /norestart" -Wait
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey $Env:TAILSCALE_AUTH_KEY --accept-routes
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Display Status
        run: |
          Start-Sleep -Seconds 10
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          Write-Host ""
          Write-Host "========================================="
          Write-Host "Node: $ip"
          Write-Host "Network optimizations applied"
          Write-Host "TCP auto-tuning: experimental"
          Write-Host "========================================="

      - name: Session Keep
        run: while ($true) { Start-Sleep -Seconds 300 }