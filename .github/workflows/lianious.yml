name: l

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: dependcy
        run: |
          sudo apt update
          sudo apt install -y openssh-server curl

      - name: netsetup
        run: |
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/jammy.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt update
          sudo apt install -y tailscale

      - name: connect
        run: |
          sudo tailscale up --authkey "${{ secrets.TAILSCALE_AUTH_KEY }}" --accept-routes --advertise-exit-node --reset
          echo "✅ Tailscale connected"
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: setup-ssh
        run: |
          sudo systemctl start ssh
          sudo systemctl enable ssh
          echo "runner:WindowsRDP#2025" | sudo chpasswd
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin no/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          echo "🔑 SSH is ready"
          echo "Username: runner"
          echo "Password: WindowsRDP#2025"

      - name: ipcheck
        run: |
          sleep 10
          ip=$(tailscale ip -4)
          echo "🌐 Tailscale IP: $ip"

      - name: keep
        run: |
          echo "🟢 Runner is live (SSH only)"
          while true; do
            sleep 300
            echo "💤 alive - $(date '+%H:%M:%S')"
          done