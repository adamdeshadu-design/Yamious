name: l

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: dependcy
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies xrdp dbus-x11 \
                              openssh-server curl git build-essential cmake

      - name: netsetup
        run: |
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/jammy.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt update
          sudo apt install -y tailscale

      - name: connect
        run: |
          sudo tailscale up --authkey "${{ secrets.TAILSCALE_AUTH_KEY }}" --accept-routes --advertise-exit-node --reset
          echo "✅ Tailscale connected"
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: setup-ssh
        run: |
          sudo systemctl start ssh
          sudo systemctl enable ssh
          echo "runner:WindowsRDP#2025" | sudo chpasswd
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin no/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          echo "🔑 SSH ready - runner / WindowsRDP#2025"

      - name: setup-gui
        run: |
          # Setup GUI for runner user
          echo "runner:WindowsRDP#2025" | sudo chpasswd
          sudo usermod -aG ssl-cert runner
          
          # Configure XFCE session
          mkdir -p /home/runner/.config
          echo "xfce4-session" > /home/runner/.xsession
          sudo chown -R runner:runner /home/runner/.xsession
          
          # Start and enable xrdp
          sudo systemctl restart xrdp
          sudo systemctl enable xrdp
          
          echo "🖥️ GUI (XFCE) + RDP Ready"
          echo "Connect using RDP → IP: Tailscale IP | User: runner | Pass: WindowsRDP#2025"

      - name: ipcheck
        run: |
          sleep 12
          ip=$(tailscale ip -4)
          echo "🌐 Tailscale IP: $ip"

      - name: keep
        run: |
          echo "🟢 Runner is live with GUI"
          while true; do
            sleep 300
            echo "💤 alive - $(date '+%H:%M:%S')"
          done