name: m

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        run: brew install tailscale

      - name: Start Tailscale daemon
        run: |
          sudo tailscaled --state=/var/lib/tailscale/tailscaled.state --tun=userspace-networking &
          sleep 10

      - name: Install NoMachine
        run: |
          brew install --cask nomachine
          
          # Start NoMachine server
          sudo /Applications/NoMachine.app/Contents/MacOS/nxserver --start || true
          sleep 8

      - name: Force Headless Display & Permissions
        run: |
          # Stronger headless setup (helps prevent black screen)
          sudo defaults write /Library/Preferences/com.apple.windowserver DisplayResolutionEnabled -bool false
          sudo killall WindowServer 2>/dev/null || true
          sleep 15
          
          # Reset privacy permissions
          sudo tccutil reset ScreenCapture 2>/dev/null || true
          sudo tccutil reset Accessibility 2>/dev/null || true
          sudo tccutil reset ScreenRecording 2>/dev/null || true

      - name: Enable Auto Login (runner user)
        run: |
          USER=$(whoami)
          sudo defaults write /Library/Preferences/com.apple.loginwindow AutoLoginUser -string "$USER"
          echo "Auto-login enabled for user: $USER"

      - name: Connect Tailscale
        run: |
          sudo tailscale up \
            --authkey ${{ secrets.TAILSCALE_AUTH_KEY }} \
            --accept-routes \
            --reset \
            --hostname=github-macos-runner
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Show Connection Info
        run: |
          echo "Waiting for services to stabilize..."
          sleep 45
          
          ip=$(tailscale ip -4)
          echo ""
          echo "=== NoMachine Connection Details ==="
          echo "Host: $ip"
          echo "Port: 4000"
          echo "Username: runner"
          echo "Password: (your macOS user password - usually blank on GitHub runners)"
          echo ""
          echo "Download NoMachine client from: https://www.nomachine.com/download"
          echo "Connect using NX protocol to the Tailscale IP above."

      - name: Keep alive
        run: while true; do sleep 300; done