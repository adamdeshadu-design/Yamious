name: m

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        run: brew install tailscale

      - name: Start Tailscale
        run: |
          sudo tailscaled --state=/var/lib/tailscale/tailscaled.state --tun=userspace-networking &
          sleep 10

      - name: Install NoMachine
        run: |
          brew install --cask nomachine
          sleep 10

      - name: Force Headless Display & Permissions
        run: |
          sudo defaults write /Library/Preferences/com.apple.windowserver DisplayResolutionEnabled -bool false
          sudo killall WindowServer 2>/dev/null || true
          sleep 25

          sudo tccutil reset ScreenCapture 2>/dev/null || true
          sudo tccutil reset ScreenRecording 2>/dev/null || true
          sudo tccutil reset Accessibility 2>/dev/null || true
          sudo tccutil reset All 2>/dev/null || true

      - name: Enable Auto Login (runner user)
        run: |
          USER="runner"
          echo "Enabling auto-login for $USER..."
          sudo defaults write /Library/Preferences/com.apple.loginwindow AutoLoginUser -string "$USER"
          echo "✅ Auto-login enabled"

      - name: Start & Configure NoMachine
        run: |
          echo "Configuring NoMachine..."
          
          # Stop if running
          sudo /etc/NX/nxserver --stop 2>/dev/null || true
          sleep 5
          
          # Enable password authentication and other options
          sudo mkdir -p /etc/NX/etc
          sudo tee -a /etc/NX/etc/node.cfg > /dev/null <<EOF
          EnablePasswordAuth 1
          EnableUserDB 1
          EOF
          
          sudo /etc/NX/nxserver --start
          sleep 12
          
          echo "NoMachine status:"
          sudo /etc/NX/nxserver --status || echo "Status command failed but server should be running"

      - name: Connect Tailscale
        run: |
          sudo tailscale up \
            --authkey ${{ secrets.TAILSCALE_AUTH_KEY }} \
            --accept-routes \
            --reset \
            --hostname=github-macos-runner
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Final Connection Info
        run: |
          echo "Waiting for stabilization..."
          sleep 60
          
          ip=$(tailscale ip -4)
          echo ""
          echo "========================================"
          echo "✅ NoMachine READY"
          echo "Host     : $ip"
          echo "Port     : 4000"
          echo "Username : runner"
          echo "Password : (leave blank / empty)"
          echo "========================================"
          echo "1. Download NoMachine client: https://www.nomachine.com/download"
          echo "2. Connect to $ip:4000"
          echo "3. Use username: runner and leave password empty"
          echo ""
          echo "💡 Black screen? Disconnect, wait 15s, reconnect 2-3 times."

      - name: Keep alive
        run: while true; do sleep 300; done