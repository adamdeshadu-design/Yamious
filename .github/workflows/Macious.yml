name: m

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        run: brew install tailscale

      - name: Start Tailscale
        run: |
          sudo tailscaled --state=/var/lib/tailscale/tailscaled.state --tun=userspace-networking &
          sleep 10

      - name: Setup Full Access (Key + Sudo)
        run: |
          # Generate SSH key for easy access
          mkdir -p \~/.ssh
          ssh-keygen -t ed25519 -f \~/.ssh/id_ed25519 -N "" -q
          
          # Add public key to authorized_keys
          cat \~/.ssh/id_ed25519.pub >> \~/.ssh/authorized_keys
          chmod 600 \~/.ssh/authorized_keys
          chmod 700 \~/.ssh
          
          # Make runner full sudo without password
          echo "runner ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/runner > /dev/null
          
          # Enable SSH password + key auth
          sudo sed -i '' 's/#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config 2>/dev/null || true
          sudo sed -i '' 's/#PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config 2>/dev/null || true
          sudo launchctl stop com.openssh.sshd 2>/dev/null || true
          sleep 3
          sudo launchctl start com.openssh.sshd

      - name: Install NoMachine (Backup GUI)
        run: |
          brew install --cask nomachine
          sudo /etc/NX/nxserver --stop 2>/dev/null || true
          sleep 5
          sudo /etc/NX/nxserver --start
          sleep 10

      - name: Connect Tailscale
        run: |
          sudo tailscale up \
            --authkey ${{ secrets.TAILSCALE_AUTH_KEY }} \
            --accept-routes \
            --reset \
            --hostname=github-macos-runner
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: 🚀 FINAL ACCESS INFO
        run: |
          sleep 60
          ip=$(tailscale ip -4)
          echo ""
          echo "========================================"
          echo "✅ FULL ACCESS READY"
          echo "Host: $ip"
          echo "Hostname: github-macos-runner-1.tail1f62c7.ts.net"
          echo ""
          echo "=== BEST WAY - SSH (No Password) ==="
          echo "ssh runner@$ip"
          echo "or"
          echo "ssh runner@github-macos-runner-1.tail1f62c7.ts.net"
          echo ""
          echo "=== If SSH fails, use this command to print your public key ==="
          echo "cat \~/.ssh/id_ed25519.pub"
          echo "========================================"

      - name: Keep alive
        run: while true; do sleep 300; done