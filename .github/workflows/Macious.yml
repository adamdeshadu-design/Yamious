name: m

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        run: |
          brew install tailscale

      - name: Start Tailscale service
        run: |
          sudo tailscaled --state=/var/lib/tailscale/tailscaled.state &
          sleep 5

      - name: Enable Screen Sharing (VNC)
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all -allowAccessFor -allUsers
          sudo defaults write /var/db/launchd.db/com.apple.launchd/overrides.plist com.apple.screensharing -dict Disabled -bool false
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

      - name: Set VNC Password
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw macpass123

      - name: Reset Screen Sharing Service
        run: |
          sudo pkill -f ScreensharingAgent 2>/dev/null || true
          sudo launchctl unload /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sleep 5
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          echo "Screen Sharing service reset"

      - name: Connect Tailscale
        run: |
          sudo tailscale up --authkey $TAILSCALE_AUTH_KEY --accept-routes
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Wait for desktop and get IP
        run: |
          echo "Waiting 90 seconds for macOS desktop to fully load..."
          sleep 90
          ip=$(tailscale ip -4)
          echo ""
          echo "========================================"
          echo "VNC CONNECTION INFO"
          echo "========================================"
          echo "Address: $ip"
          echo "Port: 5900"
          echo "Password: macpass123"
          echo ""
          echo "VNC client settings:"
          echo "  - Color: 24-bit (True Color)"
          echo "  - Encoding: Tight or ZRLE"
          echo "========================================"

      - name: Keep alive
        run: while true; do sleep 300; done