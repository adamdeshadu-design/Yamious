name: m

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        run: brew install tailscale

      - name: Start Tailscale
        run: |
          sudo tailscaled --state=/var/lib/tailscale/tailscaled.state --tun=userspace-networking &
          sleep 10

      - name: Install NoMachine
        run: |
          brew install --cask nomachine
          sudo /Applications/NoMachine.app/Contents/MacOS/nxserver --start || true
          sleep 8

      - name: Force Headless Display & Fix Permissions
        run: |
          sudo defaults write /Library/Preferences/com.apple.windowserver DisplayResolutionEnabled -bool false
          sudo killall WindowServer 2>/dev/null || true
          sleep 20

          # Reset permissions that often cause black screen
          sudo tccutil reset ScreenCapture 2>/dev/null || true
          sudo tccutil reset ScreenRecording 2>/dev/null || true
          sudo tccutil reset Accessibility 2>/dev/null || true
          sudo tccutil reset All 2>/dev/null || true

      - name: Set Password + Auto Login (Fixed for GitHub Runner)
        run: |
          USER="runner"
          PASS="123456"
          
          echo "Setting password for $USER..."
          
          # Primary method
          sudo sysadminctl -adminUser "$USER" -adminPassword "" -resetPasswordFor "$USER" -newPassword "$PASS" || true
          
          # Fallback methods
          sudo dscl . -passwd /Users/$USER "$PASS" 2>/dev/null || true
          echo "$PASS" | sudo dscl . -passwd /Users/$USER "" 2>/dev/null || true
          
          echo "Enabling auto-login..."
          sudo defaults write /Library/Preferences/com.apple.loginwindow AutoLoginUser -string "$USER"
          
          echo "✅ Password successfully set to: $PASS"

      - name: Configure & Restart NoMachine
        run: |
          sudo nxserver --stop || true
          sleep 5
          
          # Enable password authentication
          sudo sed -i '' 's/EnablePasswordAuth.*/EnablePasswordAuth 1/' /etc/nxserver/node.cfg 2>/dev/null || true
          sudo sed -i '' 's/EnablePasswordAuth.*/EnablePasswordAuth 1/' /usr/NX/etc/node.cfg 2>/dev/null || true
          
          sudo nxserver --start
          sleep 10

      - name: Connect Tailscale
        run: |
          sudo tailscale up \
            --authkey ${{ secrets.TAILSCALE_AUTH_KEY }} \
            --accept-routes \
            --reset \
            --hostname=github-macos-runner
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Final Connection Info
        run: |
          echo "Waiting for full stabilization..."
          sleep 60
          
          ip=$(tailscale ip -4)
          echo ""
          echo "========================================"
          echo "✅ SUCCESS - NoMachine is ready!"
          echo "Host : $ip"
          echo "Port : 4000"
          echo "Username : runner"
          echo "Password : 123456"
          echo "========================================"
          echo ""
          echo "1. Download NoMachine client → https://www.nomachine.com/download"
          echo "2. Connect to $ip:4000 using NX protocol"
          echo "3. Login with runner / 123456"
          echo ""
          echo "If you get black screen → disconnect and reconnect 1-2 times."

      - name: Keep alive
        run: while true; do sleep 300; done