name: m

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        run: brew install tailscale

      - name: Start Tailscale
        run: |
          sudo tailscaled --state=/var/lib/tailscale/tailscaled.state --tun=userspace-networking &
          sleep 10

      - name: Install NoMachine
        run: |
          brew install --cask nomachine
          sudo /Applications/NoMachine.app/Contents/MacOS/nxserver --start || true
          sleep 10

      - name: Force Headless Display + Permissions
        run: |
          sudo defaults write /Library/Preferences/com.apple.windowserver DisplayResolutionEnabled -bool false
          sudo killall WindowServer 2>/dev/null || true
          sleep 20

          # Reset all privacy stuff that causes black screen
          sudo tccutil reset ScreenCapture 2>/dev/null || true
          sudo tccutil reset ScreenRecording 2>/dev/null || true
          sudo tccutil reset Accessibility 2>/dev/null || true
          sudo tccutil reset All 2>/dev/null || true

      - name: Enable Auto Login + Set Password
        run: |
          USER="runner"
          PASS="123456"
          
          echo "Setting password for $USER..."
          sudo dscl . -passwd /Users/$USER "$PASS"
          
          echo "Enabling auto-login..."
          sudo defaults write /Library/Preferences/com.apple.loginwindow AutoLoginUser -string "$USER"
          
          echo "Password set to: $PASS"

      - name: Configure NoMachine (Allow all + password auth)
        run: |
          sudo nxserver --stop || true
          sleep 3
          
          # Enable password authentication
          sudo sed -i '' 's/#EnablePasswordAuth 0/EnablePasswordAuth 1/' /etc/nxserver/node.cfg 2>/dev/null || true
          sudo sed -i '' 's/#EnablePasswordAuth 0/EnablePasswordAuth 1/' /usr/NX/etc/node.cfg 2>/dev/null || true
          
          sudo nxserver --start
          sleep 8

      - name: Connect Tailscale
        run: |
          sudo tailscale up \
            --authkey ${{ secrets.TAILSCALE_AUTH_KEY }} \
            --accept-routes \
            --reset \
            --hostname=github-macos-runner
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Final Connection Info
        run: |
          echo "Waiting for full stabilization..."
          sleep 60
          
          ip=$(tailscale ip -4)
          echo ""
          echo "========================================"
          echo "✅ NoMachine READY"
          echo "Host: $ip"
          echo "Port: 4000"
          echo "Username: runner"
          echo "Password: 123456"
          echo "========================================"
          echo "1. Download NoMachine client: https://www.nomachine.com/download"
          echo "2. Connect to $ip:4000"
          echo "3. Use username + password above"
          echo "If black screen → disconnect & reconnect 1-2 times"

      - name: Keep alive
        run: while true; do sleep 300; done