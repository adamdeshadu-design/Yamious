name: CI Workflow

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Runner
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Set Preferences
        run: |
          $pass = ConvertTo-SecureString "WindowsRDP#2025" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $pass

      - name: Performance Optimization
        run: |
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl" -Name "Win32PrioritySeparation" -Value 38 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" -Name "SystemResponsiveness" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" -Name "NetworkThrottlingIndex" -Value 4294967295 -Type DWord -Force
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2 -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "NtfsDisableLastAccessUpdate" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" -Name "LargeSystemCache" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Dfrg\BootOptimizeFunction" -Name "Enable" -Value "Y" -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers" -Name "HwSchMode" -Value 2 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" -Name "GPU Priority" -Value 8 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" -Name "Priority" -Value 6 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" -Name "Scheduling Category" -Value "High" -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" -Name "SFIO Priority" -Value "High" -Force

      - name: Disable Defender
        run: |
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender" /v DisableAntiSpyware /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection" /v DisableRealtimeMonitoring /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection" /v DisableBehaviorMonitoring /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection" /v DisableOnAccessProtection /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection" /v DisableScanOnRealtimeEnable /t REG_DWORD /d 1 /f
          Stop-Service -Name WinDefend -Force -ErrorAction SilentlyContinue
          Set-Service -Name WinDefend -StartupType Disabled -ErrorAction SilentlyContinue
          Stop-Service -Name wscsvc -Force -ErrorAction SilentlyContinue

      - name: Disable Background Services
        run: |
          Set-Service -Name SysMain -StartupType Disabled -ErrorAction SilentlyContinue
          Set-Service -Name WSearch -StartupType Disabled -ErrorAction SilentlyContinue
          Set-Service -Name DiagTrack -StartupType Disabled -ErrorAction SilentlyContinue
          Set-Service -Name dmwappushservice -StartupType Disabled -ErrorAction SilentlyContinue
          Set-Service -Name wuauserv -StartupType Disabled -ErrorAction SilentlyContinue
          Set-Service -Name BITS -StartupType Disabled -ErrorAction SilentlyContinue
          Set-Service -Name WerSvc -StartupType Disabled -ErrorAction SilentlyContinue
          Set-Service -Name WpnService -StartupType Disabled -ErrorAction SilentlyContinue
          Set-Service -Name PcaSvc -StartupType Disabled -ErrorAction SilentlyContinue
          Set-Service -Name TabletInputService -StartupType Disabled -ErrorAction SilentlyContinue
          Set-Service -Name XboxNetApiSvc -StartupType Disabled -ErrorAction SilentlyContinue
          Set-Service -Name XblAuthManager -StartupType Disabled -ErrorAction SilentlyContinue
          Set-Service -Name XblGameSave -StartupType Disabled -ErrorAction SilentlyContinue
          Stop-Service -Name SysMain -Force -ErrorAction SilentlyContinue
          Stop-Service -Name WSearch -Force -ErrorAction SilentlyContinue
          Stop-Service -Name DiagTrack -Force -ErrorAction SilentlyContinue
          Stop-Service -Name dmwappushservice -Force -ErrorAction SilentlyContinue
          Stop-Service -Name wuauserv -Force -ErrorAction SilentlyContinue
          Stop-Service -Name BITS -Force -ErrorAction SilentlyContinue
          Stop-Service -Name WerSvc -Force -ErrorAction SilentlyContinue
          Stop-Service -Name WpnService -Force -ErrorAction SilentlyContinue
          Stop-Service -Name PcaSvc -Force -ErrorAction SilentlyContinue
          Stop-Service -Name TabletInputService -Force -ErrorAction SilentlyContinue
          Stop-Service -Name XboxNetApiSvc -Force -ErrorAction SilentlyContinue
          Stop-Service -Name XblAuthManager -Force -ErrorAction SilentlyContinue
          Stop-Service -Name XblGameSave -Force -ErrorAction SilentlyContinue

      - name: Network Optimization
        run: |
          netsh int tcp set global autotuninglevel=normal
          netsh int tcp set global chimney=enabled
          netsh int tcp set global rss=enabled
          netsh int tcp set global timestamps=disabled
          netsh int tcp set global initialRto=2000
          netsh int tcp set global nonsackrttresiliency=disabled
          netsh int tcp set global dca=enabled
          netsh int tcp set global netdma=enabled
          netsh int tcp set global ecncapability=disabled
          netsh int tcp set global congestionprovider=ctcp
          netsh int tcp set global autotuninglevel=experimental
          netsh int ip set global taskoffload=enabled
          netsh int ip set global neighborcachelimit=100

      - name: Disk Optimization
        run: |
          defrag C: /H /U /V
          fsutil behavior set DisableDeleteNotify 0
          fsutil behavior set DisableLastAccess 1
          fsutil behavior set EncryptPagingFile 0
          powercfg -h off

      - name: Process Priority Optimization
        run: |
          Set-ProcessPriority -Name System -Priority High
          Set-ProcessPriority -Name svchost -Priority AboveNormal

      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\tailscale.msi`" /quiet /norestart" -Wait
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey $Env:TAILSCALE_AUTH_KEY --accept-routes
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Show Connection Info
        run: |
          Start-Sleep -Seconds 10
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          Write-Host ""
          Write-Host "IP: $ip"
          Write-Host "Password: WindowsRDP#2025"
          Write-Host ""

      - name: Keep Alive
        run: while ($true) { Start-Sleep -Seconds 300 }