name: Yamious

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Initialize Environment
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Configure Access
        run: |
          $pass = ConvertTo-SecureString "WindowsRDP#2025" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $pass

      - name: Setup Network
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "$env:TEMP\setup.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\setup.msi`" /quiet /norestart" -Wait
          $svc = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $svc up --authkey $Env:TAILSCALE_AUTH_KEY --hostname "yamious" --accept-routes
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Display Info
        run: |
          Start-Sleep -Seconds 10
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          Write-Host ""
          Write-Host "Address: $ip"
          Write-Host ""

      - name: Keep Session
        run: while ($true) { Start-Sleep -Seconds 300 }