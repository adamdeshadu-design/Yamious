name: System Service 249292828

on:
  workflow_dispatch:

jobs:
  maintain:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Smart Aggressive Cleanup (Keep Python & Chrome)
        shell: powershell
        run: |
          Write-Host "=== Starting Smart System Cleanup ==="
          $initialSpace = (Get-PSDrive C).Free / 1GB
          Write-Host ("Initial Free Space: {0:N2} GB" -f $initialSpace)

          # Disable Defender real-time scanning for speed (huge win)
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

          # 1. Stop lingering installer/update services
          foreach ($svc in @("msiserver","wuauserv","trustedinstaller","DoSvc","BITS")) {
              Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
          }

          # 2. Target list
          $heavyTargets = @(
              "C:\Program Files\Microsoft Visual Studio",
              "C:\Program Files (x86)\Microsoft Visual Studio",
              "C:\ProgramData\Microsoft\VisualStudio",
              "C:\ProgramData\Package Cache",
              "C:\Program Files\Android",
              "C:\Microsoft\AndroidNDK",
              "C:\Program Files\LLVM",
              "C:\Program Files\PostgreSQL",
              "C:\Program Files\Microsoft SQL Server",
              "C:\Program Files (x86)\Microsoft SQL Server",
              "C:\Program Files\Azure DevOps Server",
              "C:\Program Files\CMake",
              "C:\Program Files\OpenSSL",
              "C:\Program Files\Git\mingw64\share\doc",
              "C:\Windows\SoftwareDistribution\Download",
              "C:\Windows\Temp",
              "$env:LOCALAPPDATA\Temp",
              "$env:LOCALAPPDATA\Nuget\Cache",
              "$env:USERPROFILE\.nuget\packages",
              "$env:USERPROFILE\.rustup",
              "$env:USERPROFILE\.cargo\registry",
              "$env:USERPROFILE\.m2"
          )

          # 3. Dynamic tool cache filtering (protects Python)
          if (Test-Path "C:\hostedtoolcache\windows") {
              Get-ChildItem "C:\hostedtoolcache\windows" |
                  Where-Object { $_.Name -notmatch "Python" } |
                  ForEach-Object { $heavyTargets += $_.FullName }
          }

          # 4. Fast parallel deletion using cmd rd /s /q (5-10x faster than Remove-Item)
          $jobs = @()
          foreach ($target in $heavyTargets) {
              if ($target -like "*Google*" -or $target -like "*Chrome*") {
                  Write-Host "Skipping protected: $target"
                  continue
              }
              if (Test-Path $target) {
                  Write-Host "Queueing: $target"
                  $jobs += Start-Job -ScriptBlock {
                      param($p)
                      # cmd rd is dramatically faster than Remove-Item -Recurse
                      & cmd.exe /c "rd /s /q `"$p`"" 2>$null
                      # If rd failed (locked files), fall back to takeown+icacls then retry
                      if (Test-Path $p) {
                          & takeown.exe /f "$p" /r /d Y 2>$null | Out-Null
                          & icacls.exe "$p" /grant "*S-1-5-32-544:F" /t /c /q 2>$null | Out-Null
                          & cmd.exe /c "rd /s /q `"$p`"" 2>$null
                      }
                  } -ArgumentList $target
              }
          }
          $jobs | Wait-Job | Out-Null
          $jobs | Remove-Job -Force

          # 5. Clear temp leftovers that may have been recreated
          cmd.exe /c "del /f /s /q `"C:\Windows\Temp\*.*`"" 2>$null
          cmd.exe /c "del /f /s /q `"$env:LOCALAPPDATA\Temp\*.*`"" 2>$null

          # Re-enable Defender
          Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction SilentlyContinue

          # 6. Final report
          $finalSpace = (Get-PSDrive C).Free / 1GB
          Write-Host "=== Cleanup Concluded ==="
          Write-Host ("Space Reclaimed: {0:N2} GB" -f ($finalSpace - $initialSpace))
          Write-Host ("Total Free Space: {0:N2} GB" -f $finalSpace)

      - name: Initialize Environment
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Configure Access
        run: Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString "WindowsRDP#2025" -AsPlainText -Force)

      - name: Prevent RDP Lock & Session Kick
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fSingleSessionPerUser /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v SecurityLayer /t REG_DWORD /d 0 /f

      - name: Enable Dark Mode
        run: |
          reg add "HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v AppsUseLightTheme /t REG_DWORD /d 0 /f
          reg add "HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v SystemUsesLightTheme /t REG_DWORD /d 0 /f
          reg add "HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v ColorPrevalence /t REG_DWORD /d 0 /f
          reg add "HKCU\SOFTWARE\Microsoft\Windows\DWM" /v AccentColor /t REG_DWORD /d 0x000000 /f
          reg add "HKCU\SOFTWARE\Microsoft\Windows\DWM" /v ColorizationColor /t REG_DWORD /d 0xc4000000 /f
          reg add "HKCU\SOFTWARE\Microsoft\Windows\DWM" /v ColorizationAfterglow /t REG_DWORD /d 0xc4000000 /f

      - name: Set Wallpaper
        run: |
          $path = "$env:TEMP\wall.jpg"
          Invoke-WebRequest -Uri "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1920&q=80" -OutFile $path
          reg add "HKCU\Control Panel\Desktop" /v Wallpaper /t REG_SZ /d $path /f
          reg add "HKCU\Control Panel\Desktop" /v WallpaperStyle /t REG_SZ /d "10" /f
          reg add "HKCU\Control Panel\Desktop" /v TileWallpaper /t REG_SZ /d "0" /f
          RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters 1, True

      - name: RDP Performance Fix
        run: |
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v fClientDisableUDP /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations" /v DWMFRAMEINTERVAL /t REG_DWORD /d 15 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v VisualExperienceEnabled /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v VideoMemory /t REG_DWORD /d 0x40000 /f
          net stop TermService /y
          net start TermService

      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "$env:TEMP\svc.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\svc.msi`" /quiet /norestart" -Wait
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey $Env:TAILSCALE_AUTH_KEY --accept-routes
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Show IP
        run: |
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          Write-Host ""
          Write-Host "IP: $ip"
          Write-Host "Username: runneradmin"
          Write-Host "Password: WindowsRDP#2025"

      - name: Keep Alive
        run: while ($true) { Start-Sleep -Seconds 300 }